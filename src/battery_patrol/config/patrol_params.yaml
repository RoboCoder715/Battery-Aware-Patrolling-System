# patrol_params.yaml
# ==================
# Robot spawns at (1.0, 1.0) — all coords are offset accordingly so the
# robot stays well inside the SLAM costmap bounds during the demo.

battery_simulator:
  ros__parameters:
    drain_rate:      1.0   # % per second  (override with drain_rate:=4.0 at launch)
    initial_charge:  100.0
    publish_rate:    1.0   # Hz

battery_monitor:
  ros__parameters:
    # ── Battery thresholds ─────────────────────────────────────────────────
    low_battery_threshold: 20.0   # % → triggers go-to-charger
    full_threshold:        95.0   # % → considered fully charged
    charge_duration:       15.0   # seconds to wait at charging station

    # ── Charging station ──────────────────────────────────────────────────
    # Robot spawns at (1.0, 1.0) so the charger is placed there.
    charger_x:    1.0
    charger_y:    1.0
    charger_yaw:  0.0

    # ── Patrol waypoints ──────────────────────────────────────────────────
    # Square loop centred around spawn (1.0, 1.0).
    # All points are at positive coords, well inside the SLAM map.
    #
    #  WP0 (2.5, 1.0) ──► WP1 (2.5, 2.5)
    #       ▲                    │
    #       │                    ▼
    #  WP3 (1.0, 1.0) ◄── WP2 (1.0, 2.5)
    #
    patrol_waypoints:
      - 2.5        # WP0  x
      - 1.0        # WP0  y
      - 0.0        # WP0  yaw  (facing +x)
      - 2.5        # WP1  x
      - 2.5        # WP1  y
      - 1.5708     # WP1  yaw  (facing +y)
      - 1.0        # WP2  x
      - 2.5        # WP2  y
      - 3.1416     # WP2  yaw  (facing -x)
      - 1.0        # WP3  x
      - 1.0        # WP3  y
      - -1.5708    # WP3  yaw  (facing -y)
